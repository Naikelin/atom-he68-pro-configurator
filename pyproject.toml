[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atom-he68-pro-configurator"
version = "0.1.0"
description = "Unofficial web configurator for the Fantech ATOM HE68 PRO (MK922)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ATOM HE68 PRO contributors" }]
dependencies = [
    "fastapi>=0.115",
    "hidapi>=0.14",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9", "mypy>=1.13"]

[tool.hatch.build.targets.wheel]
packages = ["src/atom_he68"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["atom_he68"]
